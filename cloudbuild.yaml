# Deploy contínuo: push na main → build da imagem → Cloud Run (produção).
# Recursos de produção são isolados dos de dev pelo sufixo "-production":
# serviço clikou-production, bucket clikou-fotos-production, database
# clikou-production no Atlas e segredos clikou-production-* no Secret Manager.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/clikou/app:$COMMIT_SHA
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/clikou/app:latest
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - us-central1-docker.pkg.dev/$PROJECT_ID/clikou/app

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - clikou-production
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/clikou/app:$COMMIT_SHA
      - --region=us-central1
      - --allow-unauthenticated
      - --service-account=clikou-production@$PROJECT_ID.iam.gserviceaccount.com
      # Domínio mapeado no Cloud Run (domain mapping em us-central1)
      - --set-env-vars=APP_URL=https://clikou.click,GCS_BUCKET=clikou-fotos-production,COMMISSION_PERCENT=20,ADMIN_EMAILS=eduardofranciscogabriel@gmail.com,EMAIL_FROM=nao-responda@clikou.click,GOOGLE_CLIENT_ID=405960783124-05d98dgpkdp9cfbdj2o5hmt9s34qolt3.apps.googleusercontent.com
      - --set-secrets=MONGODB_URI=clikou-production-mongodb-uri:latest,AUTH_SECRET=clikou-production-auth-secret:latest,MAILERSEND_TOKEN=clikou-production-mailersend-token:latest,GOOGLE_CLIENT_SECRET=clikou-production-google-client-secret:latest,MP_ACCESS_TOKEN=clikou-production-mp-access-token:latest,MP_CLIENT_ID=clikou-production-mp-client-id:latest,MP_CLIENT_SECRET=clikou-production-mp-client-secret:latest

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/clikou/app:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
